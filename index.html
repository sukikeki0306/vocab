<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="単語高度計">
<meta name="theme-color" content="#E9EBE4">
<title>単語を高度で覚える</title>
<style>
  :root{
    --paper:#E9EBE4; --card:#F5F6F1; --ink:#1B2830; --soft:#5E6E76;
    --faint:#A6B0AE; --line:#C6CCC2; --magenta:#A81E62; --blue:#2E5C9A; --terrain:#6F8A55;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper)}
  #app{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px; background-position:-1px -1px;
    padding:26px 18px calc(60px + env(safe-area-inset-bottom));
    line-height:1.7; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .sheet{max-width:720px;margin:0 auto}

  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .mark{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--magenta);
    border:1px solid var(--magenta);padding:2px 7px;border-radius:2px}
  .mark-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
  .mark-sub{font-size:12.5px;color:var(--soft);margin:0}
  .mode{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin:0 0 18px;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
  .dot.on{background:var(--terrain)}
  .dot.busy{background:var(--blue)}
  .dot.bad{background:var(--magenta)}

  .capture{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--magenta);
    border-radius:3px;padding:16px 16px 14px;margin-bottom:14px}
  .capture label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:8px}
  .capture-row{display:flex;gap:8px;align-items:stretch}
  textarea,input[type=text]{font-family:var(--mono);font-size:16px;padding:10px 12px;
    border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);width:100%}
  textarea{resize:vertical;line-height:1.5}
  #wordIn{flex:1;min-width:0;min-height:44px;max-height:150px}
  textarea:focus,input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
  ::placeholder{color:var(--faint);font-family:var(--sans)}

  button{font-family:inherit;cursor:pointer;border-radius:2px;transition:background .12s,color .12s}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}
  .btn-add{background:var(--magenta);color:#fff;border:none;font-size:14px;font-weight:600;
    padding:0 20px;white-space:nowrap}
  .btn-add:hover:not(:disabled){background:#8d1852}
  .hint{font-size:11.5px;color:var(--faint);margin:9px 0 0}
  .status{font-size:12.5px;color:var(--blue);margin:9px 0 0;min-height:1px}
  .status.err{color:var(--magenta)}

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .fields .wide{grid-column:1 / -1}
  .fields input{font-size:14px;padding:8px 10px}
  .fields input.ja{font-family:var(--sans)}

  .tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 15px;
    font-size:14px;color:var(--soft);margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
  .tab .n{font-family:var(--mono);font-size:12px;color:var(--magenta);margin-left:5px}

  .frame{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--card)}
  .sky{display:block;width:100%;height:auto}
  .wx{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:7px 14px;background:rgba(27,40,48,.055);border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--soft);flex-wrap:wrap}
  .wx b{color:var(--ink);font-weight:700}

  .card{padding:24px 22px 26px}
  .word{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em;
    margin:0;word-break:break-word}
  .ipa{font-family:var(--mono);font-size:13px;color:var(--soft);margin:4px 0 0}
  .pos{display:inline-block;font-size:11px;color:var(--terrain);border:1px solid var(--terrain);
    padding:1px 7px;border-radius:2px;margin-top:10px}
  .rule{border:none;border-top:1px solid var(--line);margin:18px 0}
  .meaning{font-size:19px;font-weight:600;margin:0 0 14px}
  .ex{font-family:var(--mono);font-size:13.5px;line-height:1.65;margin:0 0 4px}
  .ex-ja{font-size:13px;color:var(--soft);margin:0}
  .note{font-size:12.5px;color:var(--soft);margin:16px 0 0;padding-left:11px;border-left:2px solid var(--blue)}

  .acts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .acts button{padding:11px 16px;font-size:13.5px;border:1px solid var(--line);
    background:#fff;color:var(--ink);flex:1;min-width:96px}
  .acts button:hover{background:var(--paper)}
  .btn-reveal{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;font-weight:600}
  .btn-ok{border-color:var(--terrain)!important;color:var(--terrain)!important;font-weight:600}
  .btn-ng{border-color:var(--magenta)!important;color:var(--magenta)!important}
  .progress{font-family:var(--mono);font-size:11.5px;color:var(--soft);margin:0 0 12px}

  /* ---- 空と地上の動き ---- */
  @keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(780px)}}
  .drift-a{animation:drift 30s linear infinite}
  .drift-b{animation:drift 50s linear infinite}
  .drift-c{animation:drift 78s linear infinite}

  @keyframes rainfall{from{transform:translate(9px,-34px)}to{transform:translate(-11px,34px)}}
  .rain1{animation:rainfall .8s linear infinite}
  .rain2{animation:rainfall 1.25s linear infinite}

  @keyframes boltA{0%,84%{opacity:0}84.6%{opacity:1}85.6%{opacity:0}87%{opacity:.9}88%{opacity:0}}
  @keyframes boltB{0%,37%{opacity:0}37.6%{opacity:.9}38.4%{opacity:0}39.4%{opacity:.6}40.2%{opacity:0}}
  @keyframes glare{0%,84%{opacity:0}84.6%{opacity:.45}86%{opacity:0}87%{opacity:.3}88.4%{opacity:0}
    37%{opacity:0}37.6%{opacity:.28}38.6%{opacity:0}}
  .boltA{animation:boltA 8s steps(1,end) infinite;opacity:0}
  .boltB{animation:boltB 8s steps(1,end) infinite;opacity:0}
  .glare{animation:glare 8s steps(1,end) infinite;opacity:0}

  @keyframes strobe{0%{opacity:1}2.5%{opacity:0}5%{opacity:1}7.5%{opacity:0}100%{opacity:0}}
  .strobe{animation:strobe 2.1s steps(1,end) infinite;opacity:0}
  @keyframes beacon{0%,100%{opacity:.12}50%{opacity:1}}
  .beacon{animation:beacon 1.3s ease-in-out infinite}
  @keyframes rabbit{0%{opacity:1}10%{opacity:.25}22%{opacity:0}100%{opacity:0}}
  .rabbit{animation:rabbit 1.1s steps(1,end) infinite;opacity:0}

  @keyframes climb{0%{transform:translateY(52px) rotate(-7deg);opacity:0}
    45%{opacity:1}100%{transform:none}}
  .plane{animation:climb 1.15s cubic-bezier(.22,.72,.25,1)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(.5deg)}}
  .bob{animation:bob 7s ease-in-out infinite}
  @keyframes jolt{0%,100%{transform:translate(0,0) rotate(0)}
    20%{transform:translate(1.6px,-2px) rotate(-.8deg)}
    45%{transform:translate(-1.4px,1.6px) rotate(.7deg)}
    70%{transform:translate(1px,1px) rotate(-.4deg)}}
  .jolt{animation:jolt .45s ease-in-out infinite}
  @keyframes trail{to{stroke-dashoffset:-40}}
  .trail{stroke-dasharray:16 12;animation:trail 1.5s linear infinite}
  @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
  .glow{animation:glow 9s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  .twinkle{animation:twinkle 3.6s ease-in-out infinite}
  @keyframes lampflick{0%,100%{opacity:.85}50%{opacity:1}}
  .lamp{animation:lampflick 5s ease-in-out infinite}

  .posrow{display:flex;gap:5px;flex-wrap:wrap;grid-column:1 / -1}
  .posbtn{padding:6px 11px;font-size:12.5px;border:1px solid var(--line);
    background:#fff;color:var(--soft);border-radius:2px}
  .posbtn:hover{background:var(--paper);color:var(--ink)}
  .posbtn.on{background:var(--terrain);border-color:var(--terrain);color:#fff;font-weight:600}

  .lvlrow{display:flex;gap:6px;flex-wrap:wrap}
  .lvlbtn{flex:1;min-width:74px;padding:9px 6px;font-family:var(--mono);font-size:12px;
    border:1px solid var(--line);background:#fff;color:var(--soft)}
  .lvlbtn:hover{background:var(--paper);color:var(--ink)}
  .lvlbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}

  @media(prefers-reduced-motion:reduce){
    .drift-a,.drift-b,.drift-c,.rain1,.rain2,.boltA,.boltB,.glare,
    .strobe,.beacon,.rabbit,.plane,.bob,.jolt,.trail,.glow,.twinkle,.lamp{animation:none}
    .boltA,.strobe,.rabbit{opacity:.85}
  }

  #search{font-family:var(--sans);font-size:14px;margin-bottom:12px}
  .row{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
  .chip{width:52px;flex:none;margin-top:5px;border-radius:2px;text-align:center;
    font-family:var(--mono);font-size:9.5px;color:#fff;padding:2px 0}
  .row-body{flex:1;min-width:0}
  .row-w{font-family:var(--mono);font-size:16px;font-weight:600;margin:0}
  .row-m{font-size:13.5px;color:var(--soft);margin:1px 0 0}
  .row-due{font-size:11px;color:var(--faint);margin:3px 0 0;font-family:var(--mono)}
  .row-due.due{color:var(--magenta)}
  .row-x{background:none;border:none;color:var(--faint);font-size:17px;line-height:1;padding:4px 6px;flex:none}
  .row-x:hover{color:var(--magenta)}

  .bars{display:flex;flex-direction:column;gap:7px;margin-bottom:24px}
  .bar-line{display:flex;align-items:center;gap:10px}
  .bar-lab{font-family:var(--mono);font-size:11px;color:var(--soft);width:52px;flex:none;text-align:right}
  .bar-track{flex:1;height:16px;background:#dcdfd7;border-radius:1px;overflow:hidden}
  .bar-fill{height:100%}
  .bar-n{font-family:var(--mono);font-size:11px;color:var(--soft);width:26px;flex:none}
  .figs{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:22px}
  .fig-n{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;margin:0}
  .fig-l{font-size:12px;color:var(--soft);margin:0}

  .empty{padding:34px 4px;color:var(--soft);font-size:14px}
  .empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:5px;font-weight:700}

  .transfer{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .transfer-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .linky{background:none;border:none;color:var(--soft);font-size:12px;text-decoration:underline;padding:0}
  .linky:hover{color:var(--magenta)}
  .panel{margin-top:12px;display:none}
  .panel.open{display:block}
  .panel textarea{font-size:12px;min-height:110px;margin-bottom:8px}
  .panel .acts{margin-top:0}
  .panel .acts button{flex:0 0 auto;min-width:0;padding:8px 14px;font-size:13px}
  .panel .lab{font-size:12px;color:var(--soft);margin:0 0 4px}
  .panel .grp{margin-bottom:10px}
  .panel input{font-size:13px;padding:8px 10px}
  .panel .sub{font-size:11.5px;color:var(--faint);margin:6px 0 0}

  @media(max-width:560px){
    .word{font-size:27px}
    .card{padding:20px 16px 22px}
    .acts button{min-width:0}
    .fields{grid-template-columns:1fr}
    .wx{font-size:10px;padding:6px 10px}
  }
</style>
</head>
<body>
<div id="app">
  <div class="sheet">
    <div class="top">
      <span class="mark">VOCAB</span>
      <div>
        <p class="mark-title">単語を高度で覚える</p>
        <p class="mark-sub">正解するたび上昇。雲を抜けるほど再登場までの間隔が伸びます。</p>
      </div>
    </div>
    <p class="mode"><span id="modeText"></span><span class="dot" id="syncDot"></span><span id="syncText">同期していません</span></p>

    <div class="capture">
      <label for="wordIn" id="capLabel">わからなかった単語</label>
      <div class="capture-row">
        <textarea id="wordIn" rows="1"></textarea>
        <button class="btn-add" id="addBtn">追加</button>
      </div>
      <div class="fields" id="manualFields" style="display:none">
        <input type="text" class="ja wide" id="fMeaning" placeholder="意味（日本語）">
        <div class="posrow" id="posRow">
          <button type="button" class="posbtn" data-pos="名詞">名詞</button>
          <button type="button" class="posbtn" data-pos="動詞">動詞</button>
          <button type="button" class="posbtn" data-pos="形容詞">形容詞</button>
          <button type="button" class="posbtn" data-pos="副詞">副詞</button>
          <button type="button" class="posbtn" data-pos="前置詞">前置詞</button>
          <button type="button" class="posbtn" data-pos="接続詞">接続詞</button>
          <button type="button" class="posbtn" data-pos="熟語">熟語</button>
        </div>
        <input type="text" class="wide" id="fEx" placeholder="例文（任意）">
        <input type="text" class="ja wide" id="fExJa" placeholder="例文の訳（任意）">
      </div>
      <p class="hint" id="capHint"></p>
      <p class="status" id="status"></p>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="review">今日の復習<span class="n" id="dueN"></span></button>
      <button class="tab" data-tab="list">単語帳<span class="n" id="allN"></span></button>
      <button class="tab" data-tab="stats">記録</button>
      <button class="tab" data-tab="sky">景色</button>
    </div>

    <div id="view"></div>

    <div class="transfer">
      <div class="transfer-bar">
        <button class="linky" data-panel="sync">同期の設定</button>
        <button class="linky" data-panel="out">単語を書き出す</button>
        <button class="linky" data-panel="in">単語を読み込む</button>
        <button class="linky" id="wipe">すべて消す</button>
      </div>

      <div class="panel" id="panel-sync">
        <div class="grp"><p class="lab">プロジェクトURL</p>
          <input type="text" id="cfgUrl" placeholder="https://xxxxxxxx.supabase.co"></div>
        <div class="grp"><p class="lab">公開キー（anon public）</p>
          <input type="text" id="cfgKey" placeholder="eyJhbGci..."></div>
        <div class="grp"><p class="lab">同期コード</p>
          <input type="text" id="cfgCode" placeholder="自分だけが知る合言葉"></div>
        <div class="grp"><p class="lab">AIキー（入れると意味と例文を自動で調べます）</p>
          <input type="text" id="cfgAi" placeholder="sk-ant-..."></div>
        <div class="acts">
          <button id="cfgSave">保存して同期</button>
          <button id="syncNowBtn">いま同期する</button>
        </div>
        <p class="sub">3つとも同じ内容をパソコンとスマホの両方に入れると、単語と学習の記録が自動でそろいます。同期コードが鍵になるので、他人に教えないでください。</p>
      </div>

      <div class="panel" id="panel-out">
        <textarea id="outBox" readonly></textarea>
        <div class="acts"><button id="copyBtn">コピーする</button></div>
      </div>
      <div class="panel" id="panel-in">
        <textarea id="inBox" placeholder="書き出したテキストをここに貼り付けてください"></textarea>
        <div class="acts"><button id="importBtn">読み込む</button></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = 'vocab:words';
  var CFG = 'vocab:cfg';
  var TABLE = 'vocab_sync';
  var TOMB_DAYS = 60;

  var LEVELS = [
    { alt:'GND',   days:0,  name:'夜間・ランプアウト前', wx:'雷雨・視程不良', y:0,  tint:'#24313F',
      sky:['#080F1C','#1F3145'], mood:'nightground' },
    { alt:'1,000', days:1,  name:'上昇中', wx:'雲中・視界不良',  y:63, tint:'#78838C',
      sky:['#69767F','#A9B3B9'], mood:'incloud' },
    { alt:'5,000', days:3,  name:'上昇中', wx:'雲を抜ける',      y:53, tint:'#7FA0C0',
      sky:['#6D96BE','#C9DAE6'], mood:'breaking' },
    { alt:'FL180', days:7,  name:'安定',   wx:'晴れ・雲海の上',   y:42, tint:'#4C86BE',
      sky:['#3A7BB8','#B2D3EA'], mood:'above' },
    { alt:'FL300', days:21, name:'安定',   wx:'快晴・薄い巻雲',   y:31, tint:'#2E6BA6',
      sky:['#245E9E','#90BFDF'], mood:'high' },
    { alt:'FL350', days:90, name:'夜間巡航',   wx:'快晴・満天の星',   y:26, tint:'#132A4C',
      sky:['#03071A','#173458'], mood:'nightcruise' }
  ];
  var TOP = LEVELS.length - 1;
  var DAY = 86400000;

  var words = [], cfg = { url:'', key:'', code:'', aikey:'' };
  var tab = 'review', queue = [], shown = false, query = '', loaded = false;
  var previewLevel = 0;
  var manualPos = '';
  var syncTimer = null, syncing = false;

  var $ = function(id){ return document.getElementById(id); };
  var view = $('view');
  var hosted = !!(window.storage && typeof window.storage.get === 'function');

  var store = {
    get: function(k){
      if (hosted) return window.storage.get(k).then(function(r){ return r && r.value ? r.value : null; })
        .catch(function(){ return null; });
      try { return Promise.resolve(window.localStorage.getItem(k)); }
      catch(e){ return Promise.resolve(null); }
    },
    set: function(k, v){
      if (hosted) return window.storage.set(k, v);
      try { window.localStorage.setItem(k, v); return Promise.resolve(); }
      catch(e){ return Promise.reject(e); }
    }
  };

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function say(msg, isErr){
    var el = $('status'); el.textContent = msg || '';
    el.className = 'status' + (isErr ? ' err' : '');
  }
  function syncState(cls, text){
    $('syncDot').className = 'dot' + (cls ? ' ' + cls : '');
    $('syncText').textContent = text;
  }

  /* ---------- データ ---------- */

  function active(){ return words.filter(function(w){ return !w.deleted; }); }
  function isDue(w){ return w.due <= Date.now(); }
  function dueList(){
    return active().filter(isDue).sort(function(a,b){ return a.level - b.level || a.due - b.due; });
  }
  function touch(w){ w.updated = Date.now(); }
  function promote(w){
    w.level = Math.min(w.level + 1, TOP); w.right = (w.right||0)+1;
    w.due = Date.now() + LEVELS[w.level].days * DAY; touch(w);
  }
  function hold(w){ w.due = Date.now() + Math.max(LEVELS[w.level].days,1) * DAY; touch(w); }
  function demote(w){ w.level = 0; w.wrong = (w.wrong||0)+1; w.due = Date.now(); touch(w); }
  function dueText(w){
    var d = w.due - Date.now();
    if (d <= 0) return '復習待ち';
    var days = Math.ceil(d / DAY);
    return days === 1 ? 'あす' : days + '日後';
  }
  function makeWord(o){
    return { id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      word:o.word||'', ipa:o.ipa||'', pos:o.pos||'', meaning:o.meaning||'',
      example:o.example||'', exampleJa:o.exampleJa||'', note:o.note||'',
      level:0, due:Date.now(), created:Date.now(), updated:Date.now(),
      right:0, wrong:0, deleted:false };
  }
  function find(term){
    var k = String(term).toLowerCase();
    for (var i = 0; i < words.length; i++){
      if ((words[i].word||'').toLowerCase() === k) return words[i];
    }
    return null;
  }
  function known(term){ var w = find(term); return !!(w && !w.deleted); }
  function addWord(data){
    var old = find(data.word), fresh = makeWord(data);
    if (old){ fresh.id = old.id; fresh.created = old.created; words[words.indexOf(old)] = fresh; }
    else { words.unshift(fresh); }
  }
  function prune(){
    var cut = Date.now() - TOMB_DAYS * DAY;
    words = words.filter(function(w){ return !(w.deleted && (w.updated||0) < cut); });
  }

  function load(){
    Promise.all([store.get(KEY), store.get(CFG)]).then(function(r){
      try { words = r[0] ? JSON.parse(r[0]) : []; } catch(e){ words = []; }
      if (!Array.isArray(words)) words = [];
      try { if (r[1]) cfg = JSON.parse(r[1]) || cfg; } catch(e){}
      $('cfgUrl').value = cfg.url || '';
      $('cfgKey').value = cfg.key || '';
      $('cfgCode').value = cfg.code || '';
      $('cfgAi').value = cfg.aikey || '';
      applyMode();
      loaded = true; rebuild();
      if (ready()) syncNow(true); else syncState('', '同期していません');
    });
  }
  function save(push){
    prune();
    var p = store.set(KEY, JSON.stringify(words)).catch(function(){
      say('保存できませんでした。プライベートブラウズを解除すると保存できます。', true);
    });
    if (push !== false) schedulePush();
    return p;
  }

  /* ---------- 同期 ---------- */

  function ready(){ return !!(cfg.url && cfg.key && cfg.code); }
  function base(){ return cfg.url.replace(/\/+$/, '') + '/rest/v1/' + TABLE; }
  function heads(extra){
    var h = { 'apikey': cfg.key, 'Content-Type':'application/json' };
    /* 旧形式（eyJ で始まるJWT）のときだけ Authorization も送る。
       新形式の sb_publishable_ キーは apikey だけで認証される。 */
    if (cfg.key.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + cfg.key;
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function merge(a, b){
    var map = {}, order = [];
    function put(w){
      if (!w || !w.word) return;
      var k = String(w.word).toLowerCase(), cur = map[k];
      if (!cur){ map[k] = w; order.push(k); return; }
      if ((w.updated||0) > (cur.updated||0)) map[k] = w;
    }
    a.forEach(put); b.forEach(put);
    return order.map(function(k){ return map[k]; });
  }
  function syncNow(quiet){
    if (!ready()){ if (!quiet) say('同期の設定を先に入力してください。', true); return Promise.resolve(); }
    if (syncing) return Promise.resolve();
    syncing = true; syncState('busy', '同期中');
    var url = base() + '?code=eq.' + encodeURIComponent(cfg.code) + '&select=data';
    return fetch(url, { headers: heads() }).then(function(res){
      if (!res.ok) throw new Error('読み込み ' + res.status); return res.json();
    }).then(function(rows){
      var remote = (rows && rows[0] && Array.isArray(rows[0].data)) ? rows[0].data : [];
      words = merge(words, remote); prune();
      return store.set(KEY, JSON.stringify(words));
    }).then(function(){
      return fetch(base(), { method:'POST',
        headers: heads({ 'Prefer':'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify([{ code: cfg.code, data: words, updated_at: new Date().toISOString() }]) });
    }).then(function(res){
      if (!res.ok) throw new Error('書き込み ' + res.status);
      syncing = false; syncState('on', '同期しました'); rebuild();
    }).catch(function(err){
      syncing = false;
      var offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
      syncState('bad', offline ? 'オフライン（あとで同期）' : '同期できません');
      if (!quiet){
        var m = String(err && err.message || '');
        var tip = m.indexOf('404') > -1 ? 'テーブルがまだありません。SupabaseのSQL Editorで作成してください。'
          : m.indexOf('401') > -1 || m.indexOf('403') > -1 ? '公開キーかアクセス設定が違います。'
          : m.indexOf('400') > -1 ? '送信内容が受け付けられませんでした。'
          : 'URLが違うか、通信できていません。';
        say('同期に失敗しました（' + (m || '不明') + '）。' + tip, true);
      }
      rebuild();
    });
  }
  function schedulePush(){
    if (!ready()) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncNow(true); }, 2500);
  }

  /* ---------- AI で調べる（Claude の中だけ動く） ---------- */

  var SYS = 'あなたは英語学習用の辞書です。渡された英単語について、次のキーだけを持つJSONオブジェクトを1つ返してください。'
    + 'word（見出し語の原形）, ipa（IPA発音記号。スラッシュで囲む）, pos（品詞を日本語で）, '
    + 'meaning（日本語の意味。最も一般的なものを25字以内で）, example（その語を使った自然な英文。12〜18語程度。ビジネス・旅行・報道いずれかの文脈で）, '
    + 'exampleJa（exampleの日本語訳）, note（学習メモを日本語50字以内で。よく使う組み合わせ、紛らわしい類義語との違い、語源のいずれか）。'
    + 'JSON以外は一切出力しないでください。';

  function canLookup(){ return hosted || !!cfg.aikey; }

  function lookup(term){
    var h = { 'Content-Type':'application/json' };
    var model = 'claude-sonnet-4-6';
    if (!hosted){
      h['x-api-key'] = cfg.aikey;
      h['anthropic-version'] = '2023-06-01';
      h['anthropic-dangerous-direct-browser-access'] = 'true';
      model = 'claude-haiku-4-5-20251001';
    }
    return fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:h,
      body: JSON.stringify({ model:model, max_tokens:1000, system:SYS,
        messages:[{ role:'user', content:term }] })
    }).then(function(res){
      if (!res.ok) throw new Error('http'); return res.json();
    }).then(function(data){
      var text = (data.content||[]).map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
      var clean = text.replace(/```json/g,'').replace(/```/g,'').trim();
      var s = clean.indexOf('{'), e = clean.lastIndexOf('}');
      if (s === -1 || e === -1) throw new Error('parse');
      return JSON.parse(clean.slice(s, e+1));
    });
  }

  function addAuto(){
    var terms = $('wordIn').value.split(/[,\n、]/).map(function(t){ return t.trim(); })
      .filter(function(t){ return t.length > 0; });
    if (!terms.length){ say('単語を入力してください。', true); return; }
    var btn = $('addBtn'); btn.disabled = true;
    var done = 0, failed = [], skipped = [];
    function step(i){
      if (i >= terms.length){
        btn.disabled = false; $('wordIn').value = '';
        var msg = done + '語を追加しました。';
        if (skipped.length) msg += ' 登録済み: ' + skipped.join(', ') + '。';
        if (failed.length) msg += ' 調べられなかった単語: ' + failed.join(', ') + '。';
        say(msg, failed.length > 0); save().then(rebuild); return;
      }
      var term = terms[i];
      say('調べています… ' + term + '（' + (i+1) + '/' + terms.length + '）');
      if (known(term)){ skipped.push(term); step(i+1); return; }
      lookup(term).then(function(d){
        if (known(d.word || term)){ skipped.push(term); step(i+1); return; }
        addWord(d); done++; step(i+1);
      }).catch(function(){ failed.push(term); step(i+1); });
    }
    step(0);
  }

  function addManual(){
    var w = $('wordIn').value.trim(), m = $('fMeaning').value.trim();
    if (!w){ say('単語を入力してください。', true); return; }
    if (!m){ say('意味を入力してください。', true); return; }
    if (known(w)){ say('その単語はすでに登録されています。', true); return; }
    addWord({ word:w, meaning:m, pos:manualPos,
      example:$('fEx').value.trim(), exampleJa:$('fExJa').value.trim() });
    ['wordIn','fMeaning','fEx','fExJa'].forEach(function(id){ $(id).value=''; });
    manualPos = '';
    Array.prototype.forEach.call($('posRow').children, function(b){ b.className = 'posbtn'; });
    say(w + ' を追加しました。'); save().then(rebuild);
  }

  /* ---------- 機体 ---------- */

  var BODY = '#FBFCFD', SHADE = '#D5DDE4', NAVY = '#123B72', NAVY2 = '#1E5AA8', GLASS = '#2B3A46';

  /* 側面の旅客機。白い胴体に濃紺の尾翼。opts: {gear, scale, cls} */
  function planeSVG(x, y, opts){
    var o = opts || {};
    var sc = o.scale || 0.78;
    var g = '<g class="' + (o.cls || '') + '" transform="translate(' + x + ',' + y + ') scale(' + sc + ')">';

    /* 奥の主翼 */
    g += '<path d="M50 11 L34 -1 L43 -1 L66 10 Z" fill="' + SHADE + '"/>';
    /* 水平尾翼 */
    g += '<path d="M14 12 L1 3 L10 3 L27 11 Z" fill="' + SHADE + '"/>';
    /* 垂直尾翼 */
    g += '<path d="M12 11 L4 -22 L13 -22 Q22 -8 30 9 Z" fill="' + NAVY + '"/>';
    g += '<path d="M12 11 L8 -8 Q17 -2 26 9 Z" fill="' + NAVY2 + '" opacity=".55"/>';
    /* 胴体 */
    g += '<path d="M7 17 C7 11 16 8.5 27 8 L74 7 C87 7 94 11 94 16 '
       + 'C94 20 88 22.5 76 23 L27 24 C15 24 7 22 7 17 Z" fill="' + BODY + '"/>';
    /* 胴体下部の帯 */
    g += '<path d="M9 20.5 C16 23.4 20 24 27 24 L76 23 C86 22.6 92 20.8 93.4 18.4 '
       + 'L92 21 C89 23.2 84 23.9 76 24.3 L27 25.2 C16 25.2 10.5 23.4 9 20.5 Z" fill="' + NAVY + '"/>';
    g += '<rect x="9" y="20.4" width="84" height="2.6" fill="' + NAVY + '" opacity=".85"/>';
    /* 操縦室窓 */
    g += '<path d="M84 11.5 Q90 12.2 92 14.6 L85.5 14.2 Z" fill="' + GLASS + '"/>';
    /* 客室窓。夜は室内灯が灯る */
    var win = '';
    for (var i = 0; i < 13; i++){
      win += '<rect x="' + (28 + i*4.4) + '" y="13.4" width="2.1" height="2.1" rx=".6"/>';
    }
    g += '<g fill="' + (o.night ? '#FFDE9E' : GLASS) + '" opacity="' + (o.night ? '.95' : '.72') + '">' + win + '</g>';
    /* 手前の主翼とエンジン */
    g += '<path d="M46 16 L28 32 L39 32 L64 18.5 Z" fill="#EEF2F5"/>';
    g += '<g><ellipse cx="45" cy="24.5" rx="10.5" ry="5.2" fill="#EDF1F4"/>'
       + '<ellipse cx="45" cy="24.5" rx="10.5" ry="5.2" fill="none" stroke="' + SHADE + '" stroke-width=".8"/>'
       + '<path d="M36 22.6 a10.5 5.2 0 0 0 0 3.8 l2.4 0 a8 4 0 0 1 0 -3.8 Z" fill="' + NAVY + '"/></g>';

    if (o.gear){
      g += '<g stroke="#8B98A1" stroke-width="1.7" fill="#20282E">'
        + '<line x1="84" y1="23" x2="84" y2="30"/><circle cx="84" cy="31.6" r="2.6" stroke="none"/>'
        + '<line x1="44" y1="28" x2="44" y2="31"/><circle cx="42" cy="33" r="3" stroke="none"/>'
        + '<circle cx="47.5" cy="33" r="3" stroke="none"/></g>';
    }
    if (o.night){
      /* 着陸灯と航法灯 */
      g += '<circle cx="90" cy="18" r="2.2" fill="#FFF6D6"/>';
      g += '<circle cx="90" cy="18" r="6" fill="#FFF6D6" opacity=".28"/>';
      g += '<circle cx="40" cy="26" r="1.8" fill="#FFF6D6"/>';
      g += '<circle cx="40" cy="26" r="5" fill="#FFF6D6" opacity=".22"/>';
      g += '<circle cx="28" cy="32" r="2" fill="#4BD07A"/>';
      g += '<circle cx="28" cy="32" r="5.5" fill="#4BD07A" opacity=".25"/>';
    }
    /* 翼端ストロボと衝突防止灯 */
    g += '<circle class="strobe" cx="28" cy="32" r="2.4" fill="#FFFFFF"/>';
    g += '<circle class="strobe" cx="34" cy="-1" r="2" fill="#FFFFFF"/>';
    g += '<circle class="beacon" cx="50" cy="7.6" r="1.9" fill="#E0403F"/>';
    g += '<circle class="beacon" cx="50" cy="24.6" r="1.7" fill="#E0403F"/>';
    return g + '</g>';
  }

  /* ---------- 空 ---------- */

  function puff(cx, cy, s, fill, op){
    return '<g fill="' + fill + '" opacity="' + op + '">'
      + '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (34*s) + '" ry="' + (13*s) + '"/>'
      + '<circle cx="' + (cx - 16*s) + '" cy="' + (cy - 5*s) + '" r="' + (11*s) + '"/>'
      + '<circle cx="' + (cx + 2*s) + '" cy="' + (cy - 11*s) + '" r="' + (15*s) + '"/>'
      + '<circle cx="' + (cx + 19*s) + '" cy="' + (cy - 4*s) + '" r="' + (10*s) + '"/></g>';
  }
  function cb(cx, base, s, fill){
    return '<g fill="' + fill + '">'
      + '<ellipse cx="' + cx + '" cy="' + base + '" rx="' + (48*s) + '" ry="' + (16*s) + '"/>'
      + '<circle cx="' + (cx - 24*s) + '" cy="' + (base - 15*s) + '" r="' + (18*s) + '"/>'
      + '<circle cx="' + (cx + 21*s) + '" cy="' + (base - 17*s) + '" r="' + (20*s) + '"/>'
      + '<circle cx="' + (cx - 4*s) + '" cy="' + (base - 36*s) + '" r="' + (25*s) + '"/>'
      + '<ellipse cx="' + (cx + 3*s) + '" cy="' + (base - 58*s) + '" rx="' + (46*s) + '" ry="' + (13*s) + '"/></g>';
  }
  function rainLayer(cls, dx){
    var r = '';
    for (var i = 0; i < 40; i++){
      var rx = (i * 18 + 5) % 760;
      r += '<line x1="' + rx + '" y1="0" x2="' + (rx - 7) + '" y2="21" stroke="#CBD5DC" stroke-width="1.1" opacity=".42"/>';
    }
    return '<g class="' + cls + '" transform="translate(' + dx + ',0)">' + r + '</g>';
  }

  /* 見た目が毎回変わらないように、位置は固定の疑似乱数から決める */
  function rnd(i){ var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

  /* 夜の空港。滑走路・誘導路・ターミナルを奥行きをつけて描く */
  function groundScene(W, H){
    var hz = 112;
    var s = '';

    /* 遠景の積乱雲。夜なので雲そのものは暗く、雷で内側から光る */
    s += cb(140, hz - 4, 1.15, '#141E2C') + cb(575, hz, 1.0, '#101927') + cb(370, hz - 2, .8, '#16202E');
    s += '<g class="boltA"><path d="M286 34 l-17 47 l15 0 l-12 42 l43 -60 l-18 0 l13 -29 z" fill="#CFE4FF"/>'
       + '<ellipse cx="286" cy="70" rx="96" ry="52" fill="#7FA8DA" opacity=".28"/></g>';
    s += '<g class="boltB"><path d="M492 52 l-12 32 l11 0 l-9 28 l30 -41 l-13 0 l9 -19 z" fill="#CFE4FF"/>'
       + '<ellipse cx="492" cy="80" rx="74" ry="42" fill="#7FA8DA" opacity=".22"/></g>';

    /* 地面 */
    s += '<rect x="0" y="' + hz + '" width="' + W + '" height="' + (H - hz) + '" fill="#0D1621"/>';

    /* 管制塔 */
    s += '<g><rect x="356" y="58" width="13" height="54" fill="#101B26"/>'
       + '<path d="M348 62 h29 l-4 -13 h-21 Z" fill="#16232F"/>'
       + '<rect x="352" y="50" width="21" height="9" fill="#FFD98A" opacity=".85"/>'
       + '<circle class="beacon" cx="362.5" cy="44" r="2.6" fill="#E0403F"/></g>';

    /* ターミナル。窓の明かりは一部だけ点灯させる */
    s += '<rect x="392" y="86" width="292" height="26" fill="#0F1A25"/>';
    s += '<path d="M392 86 q146 -13 292 0 Z" fill="#13202C"/>';
    var win = '';
    for (var r = 0; r < 3; r++){
      for (var c = 0; c < 34; c++){
        if (rnd(r * 40 + c) > 0.34){
          win += '<rect x="' + (398 + c * 8.4) + '" y="' + (90 + r * 7.4) + '" width="5.4" height="4.4" '
              + 'fill="#FFD98A" opacity="' + (0.45 + rnd(c * 3 + r) * 0.5).toFixed(2) + '"/>';
        }
      }
    }
    s += '<g class="lamp">' + win + '</g>';
    /* 搭乗橋と、駐機中の機体の尾翼 */
    s += '<rect x="470" y="104" width="46" height="5" fill="#1A2husk"/>'.replace('#1A2husk', '#1A2733');
    s += '<rect x="596" y="104" width="42" height="5" fill="#1A2733"/>';
    s += '<path d="M540 112 l-7 -19 h7 q8 10 13 19 Z" fill="#16283F"/>';
    s += '<path d="M660 112 l-6 -16 h6 q7 8 11 16 Z" fill="#16283F"/>';
    /* 投光器のポール */
    s += '<g><rect x="700" y="70" width="3" height="42" fill="#16222E"/></g>';

    /* 誘導路（手前左から奥へ） */
    s += '<polygon points="-40,190 210,124 268,124 150,190" fill="#141D26"/>';
    /* 誘導路中心線（緑） */
    s += '<path d="M120 190 Q186 150 240 124" stroke="#2E6B3F" stroke-width="2.2" fill="none" opacity=".9"/>';

    /* 滑走路 */
    s += '<polygon points="150,190 268,124 340,124 800,190" fill="#182029"/>';
    /* 濡れた路面の照り返し */
    s += '<polygon points="150,190 268,124 276,124 182,190" fill="#2C3A48" opacity=".4"/>';

    /* 中心線 */
    var cl = '';
    for (var i = 0; i < 9; i++){
      var t = i / 9;
      var y = 190 - t * 66;
      var wd = 9 * (1 - t) + 1.2, ht = 8 * (1 - t) + 1;
      cl += '<rect x="' + (300 - wd / 2 + t * 12) + '" y="' + (y - ht) + '" width="' + wd
          + '" height="' + ht + '" fill="#DCE4EA" opacity="' + (0.75 - t * 0.35).toFixed(2) + '"/>';
    }
    s += cl;

    /* 灯火。光の玉＋にじみ＋路面への映り込み */
    function lamp(x, y, r, color, reflect){
      var g = '<circle cx="' + x + '" cy="' + y + '" r="' + (r * 3.4) + '" fill="' + color + '" opacity=".16"/>'
            + '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>';
      if (reflect) g += '<ellipse cx="' + x + '" cy="' + (y + r * 3.2) + '" rx="' + (r * .7)
            + '" ry="' + (r * 3) + '" fill="' + color + '" opacity=".2"/>';
      return g;
    }
    var lights = '';
    for (var j = 0; j < 13; j++){
      var u = j / 13;
      var ly = 190 - u * 66;
      var rr = 2.5 * (1 - u) + .8;
      lights += lamp(150 + u * 120, ly, rr, '#FFE9B0', true);
      lights += lamp(660 - u * 392, ly, rr, '#FFE9B0', true);
    }
    /* 滑走路末端の緑 */
    for (var t2 = 0; t2 < 5; t2++){
      lights += lamp(272 + t2 * 14, 125, 1.5, '#5CE08A', false);
    }
    s += '<g class="lamp">' + lights + '</g>';

    /* 誘導路灯（青） */
    var blues = '';
    for (var b = 0; b < 9; b++){
      var v = b / 9;
      blues += lamp(78 + v * 140, 190 - v * 64, 2.3 * (1 - v) + .8, '#6FB4FF', true);
      blues += lamp(196 + v * 66, 190 - v * 64, 2.0 * (1 - v) + .7, '#6FB4FF', false);
    }
    s += '<g class="lamp">' + blues + '</g>';

    /* 進入灯。奥へ向かって順に流れる */
    var rab = '';
    for (var k = 0; k < 8; k++){
      rab += '<g class="rabbit" style="animation-delay:' + (k * 0.085 - 0.62).toFixed(2) + 's">'
          + lamp(348 + k * 44, 124 + k * 8, 1.5 + k * 0.4, '#FFFFFF', false) + '</g>';
    }
    s += rab;

    /* 機体。着陸灯を点け、脚を出して滑走路上に */
    s += '<path d="M258 140 L420 116 L430 150 L262 152 Z" fill="#FFF2C8" opacity=".13"/>';
    s += planeSVG(196, 128, { gear:true, scale:.82, cls:'plane jolt', night:true });

    /* 雨と閃光 */
    s += rainLayer('rain1', 0) + rainLayer('rain2', 12);
    s += '<rect class="glare" width="' + W + '" height="' + H + '" fill="#9FC2E8"/>';
    s += '<text x="18" y="183" font-family="ui-monospace,monospace" font-size="11" fill="#6C8098">RWY 01L　WIND 240/22G34　TSRA　NIGHT</text>';
    return s;
  }

  /* 夜の巡航高度。星空と月、はるか下の雲と街明かり */
  function nightCruise(W, H, py){
    var s = '';
    /* 天の川 */
    s += '<g transform="rotate(-14 350 60)" opacity=".2">'
       + '<ellipse cx="350" cy="56" rx="330" ry="26" fill="#8FB8E8"/>'
       + '<ellipse cx="350" cy="56" rx="250" ry="14" fill="#C9DCF5" opacity=".6"/></g>';
    /* 星 */
    var stars = '';
    for (var i = 0; i < 110; i++){
      var sx = rnd(i * 1.7) * W;
      var sy = rnd(i * 3.1 + 5) * (H * 0.72);
      var sr = 0.5 + rnd(i * 5.3) * 1.3;
      stars += '<circle class="twinkle" style="animation-delay:-' + (rnd(i * 7.7) * 3.6).toFixed(2)
            + 's" cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + sr.toFixed(2) + '" fill="#FFFFFF"/>';
    }
    s += stars;
    /* ひときわ明るい星 */
    s += '<g class="twinkle" style="animation-delay:-1.4s">'
       + '<circle cx="128" cy="42" r="1.9" fill="#FFFFFF"/>'
       + '<path d="M128 34 L129 41 L136 42 L129 43 L128 50 L127 43 L120 42 L127 41 Z" fill="#FFFFFF" opacity=".7"/></g>';
    /* 月 */
    s += '<circle class="glow" cx="596" cy="40" r="46" fill="url(#sun)" opacity=".45"/>';
    s += '<circle cx="596" cy="40" r="17" fill="#F3F1E2"/>';
    s += '<g fill="#DED9C6" opacity=".65"><circle cx="590" cy="35" r="4"/>'
       + '<circle cx="602" cy="46" r="3"/><circle cx="600" cy="33" r="2.2"/></g>';
    /* 機体と飛行機雲 */
    s += '<path class="trail" d="M292 ' + (py + 20) + ' L48 ' + (py + 31) + '" stroke="#C9DCF5" stroke-width="3.2" opacity=".28" stroke-linecap="round"/>';
    s += planeSVG(292, py, { scale:.82, cls:'plane bob', night:true });
    /* はるか下の雲と街明かり */
    s += '<rect x="0" y="' + (H - 26) + '" width="' + W + '" height="26" fill="#1B2B45" opacity=".9"/>';
    var town = '';
    for (var t = 0; t < 46; t++){
      town += '<circle cx="' + (rnd(t * 2.3) * W).toFixed(1) + '" cy="' + (H - 20 + rnd(t * 4.1) * 16).toFixed(1)
           + '" r="' + (0.6 + rnd(t * 6.1) * 0.9).toFixed(2) + '" fill="#FFC98A" opacity="' + (0.3 + rnd(t) * 0.5).toFixed(2) + '"/>';
    }
    s += '<g class="lamp">' + town + '</g>';
    s += '<g opacity=".55">' + puff(230, 196, 3, '#2B4468', .9) + puff(560, 198, 2.6, '#2B4468', .9) + '</g>';
    return s;
  }

  function skyHTML(L){
    var W = 700, H = 190;
    var s = '<svg class="sky" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + L.wx + '">'
      + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="' + L.sky[0] + '"/><stop offset="1" stop-color="' + L.sky[1] + '"/></linearGradient>'
      + '<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">'
      + '<stop offset="0" stop-color="#FFF7E2" stop-opacity=".95"/>'
      + '<stop offset="1" stop-color="#FFF7E2" stop-opacity="0"/></radialGradient></defs>'
      + '<rect width="' + W + '" height="' + H + '" fill="url(#g)"/>';

    var py = H * L.y / 100;

    if (L.mood === 'nightground'){
      s += groundScene(W, H);
    }
    else if (L.mood === 'nightcruise'){
      s += nightCruise(W, H, py);
    }
    else if (L.mood === 'incloud'){
      s += '<g class="drift-c">' + puff(120, 52, 1.6, '#B7C1C7', .5) + '</g>';
      s += '<g class="drift-b">' + puff(-60, 34, 1.9, '#AEB8BF', .45) + '</g>';
      s += planeSVG(292, py, { scale:.78, cls:'plane jolt' });
      s += '<g class="drift-a">' + puff(40, 104, 2.4, '#C6CFD4', .85) + '</g>';
      s += '<g class="drift-b">' + puff(-90, 152, 2.7, '#D2D9DD', .92) + '</g>';
      s += rainLayer('rain2', 4);
      s += '<rect width="' + W + '" height="' + H + '" fill="#B4BEC5" opacity=".3"/>';
    }
    else if (L.mood === 'breaking'){
      s += '<g class="drift-c">' + puff(90, 34, 1.1, '#E7EEF4', .45) + '</g>';
      s += planeSVG(292, py, { scale:.78, cls:'plane bob' });
      s += '<g class="drift-a">' + puff(80, 152, 2.3, '#DAE5EC', .9) + '</g>';
      s += puff(410, 172, 2.9, '#E7EFF4', .95) + puff(630, 160, 2.2, '#DCE6ED', .9);
      s += '<g class="drift-b">' + puff(200, 186, 2.6, '#EFF5F8', .95) + '</g>';
    }
    else if (L.mood === 'above'){
      s += '<circle class="glow" cx="602" cy="32" r="54" fill="url(#sun)"/>';
      s += '<g class="drift-c">' + puff(150, 46, .85, '#FFFFFF', .45) + '</g>';
      s += planeSVG(292, py, { scale:.78, cls:'plane bob' });
      s += puff(100, 178, 2.6, '#E9F1F6', .95) + puff(400, 186, 3, '#F1F7FA', .95);
      s += '<g class="drift-a">' + puff(560, 176, 2.3, '#E4EDF3', .9) + '</g>';
    }
    else if (L.mood === 'high'){
      s += '<circle class="glow" cx="614" cy="28" r="60" fill="url(#sun)"/>';
      s += '<g class="drift-b" opacity=".5">'
        + '<path d="M50 60 q64 -12 138 -2" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>'
        + '<path d="M420 44 q56 -10 116 -1" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
      s += '<path class="trail" d="M292 ' + (py + 20) + ' L120 ' + (py + 26) + '" stroke="#FFFFFF" stroke-width="3" opacity=".35" stroke-linecap="round"/>';
      s += planeSVG(292, py, { scale:.78, cls:'plane bob' });
      s += '<g opacity=".75">' + puff(180, 188, 2.4, '#E9F1F6', .8) + puff(520, 192, 2.7, '#EDF3F7', .8) + '</g>';
    }
    else {
      s += '<circle class="glow" cx="620" cy="24" r="68" fill="url(#sun)"/>';
      s += '<circle cx="620" cy="24" r="13" fill="#FFF9E8" opacity=".95"/>';
      s += '<g class="drift-c" opacity=".35">'
        + '<path d="M70 46 q72 -10 154 -2" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
      s += '<path class="trail" d="M292 ' + (py + 20) + ' L60 ' + (py + 30) + '" stroke="#FFFFFF" stroke-width="3.4" opacity=".4" stroke-linecap="round"/>';
      s += planeSVG(292, py, { scale:.82, cls:'plane bob' });
      s += '<path d="M0 92 Q170 84 320 92" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity=".22"/>';
      s += '<g opacity=".5">' + puff(250, 194, 3, '#DBE9F3', .7) + puff(560, 196, 2.6, '#DBE9F3', .7) + '</g>';
    }
    return s + '</svg>';
  }

  /* ---------- 表示 ---------- */

  function renderReview(){
    if (!queue.length) queue = dueList();
    if (!active().length){
      view.innerHTML = '<div class="empty"><strong>まだ単語がありません</strong>'
        + '上の欄に、読んでいて詰まった単語を入れてください。</div>';
      return;
    }
    if (!queue.length){
      var next = active().slice().sort(function(a,b){ return a.due - b.due; })[0];
      view.innerHTML = '<div class="frame">' + skyHTML(LEVELS[TOP])
        + '<div class="card"><div class="empty" style="padding:18px 0"><strong>今日の復習は終わりです</strong>'
        + '次の単語は' + esc(dueText(next)) + 'に出てきます。</div></div></div>';
      return;
    }
    var w = queue[0], L = LEVELS[w.level], body;
    if (!shown){
      body = '<p class="word">' + esc(w.word) + '</p>'
        + '<div class="acts"><button class="btn-reveal" data-act="reveal">意味を見る</button></div>';
    } else {
      body = '<p class="word">' + esc(w.word) + '</p>'
        + (w.ipa ? '<p class="ipa">' + esc(w.ipa) + '</p>' : '')
        + (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '')
        + '<hr class="rule">'
        + '<p class="meaning">' + esc(w.meaning) + '</p>'
        + (w.example ? '<p class="ex">' + esc(w.example) + '</p>' : '')
        + (w.exampleJa ? '<p class="ex-ja">' + esc(w.exampleJa) + '</p>' : '')
        + (w.note ? '<p class="note">' + esc(w.note) + '</p>' : '')
        + '<div class="acts">'
        + '<button class="btn-ng" data-act="ng">わからない</button>'
        + '<button data-act="hold">あやしい</button>'
        + '<button class="btn-ok" data-act="ok">わかった</button></div>';
    }
    view.innerHTML = '<p class="progress">残り ' + queue.length + ' 語</p>'
      + '<div class="frame">' + skyHTML(L)
      + '<div class="wx"><span>現在高度 <b>' + L.alt + '</b>　' + esc(L.name) + '</span>'
      + '<span>' + esc(L.wx) + '</span></div>'
      + '<div class="card">' + body + '</div></div>';
  }

  function renderList(){
    var q = query.toLowerCase(), all = active();
    var rows = all.filter(function(w){
      return !q || w.word.toLowerCase().indexOf(q) > -1 || (w.meaning||'').indexOf(query) > -1;
    });
    var h = '<input type="text" id="search" placeholder="単語や意味で探す" value="' + esc(query) + '">';
    if (!all.length){
      h += '<div class="empty"><strong>単語帳は空です</strong>追加した単語がここに並びます。</div>';
    } else if (!rows.length){
      h += '<div class="empty"><strong>見つかりません</strong>別の言葉で探してみてください。</div>';
    } else {
      h += rows.map(function(w){
        var L = LEVELS[w.level];
        return '<div class="row"><div class="chip" style="background:' + L.tint + '">' + L.alt + '</div>'
          + '<div class="row-body"><p class="row-w">' + esc(w.word) + '</p>'
          + '<p class="row-m">' + esc(w.meaning) + '</p>'
          + '<p class="row-due' + (isDue(w) ? ' due' : '') + '">' + esc(dueText(w)) + '</p></div>'
          + '<button class="row-x" data-del="' + esc(w.id) + '" title="削除">×</button></div>';
      }).join('');
    }
    view.innerHTML = h;
    var sEl = $('search');
    sEl.addEventListener('input', function(){
      query = sEl.value; var pos = sEl.selectionStart;
      renderList();
      var s2 = $('search'); s2.focus(); s2.setSelectionRange(pos, pos);
    });
  }

  function renderStats(){
    var all = active();
    if (!all.length){
      view.innerHTML = '<div class="empty"><strong>記録はまだありません</strong>'
        + '単語を追加すると、定着の様子がここに出ます。</div>';
      return;
    }
    var counts = LEVELS.map(function(){ return 0; }), right = 0, wrong = 0;
    all.forEach(function(w){ counts[w.level]++; right += (w.right||0); wrong += (w.wrong||0); });
    var max = Math.max.apply(null, counts) || 1;
    var acc = (right + wrong) ? Math.round(right / (right + wrong) * 100) : 0;
    var bars = '';
    for (var i = TOP; i >= 0; i--){
      bars += '<div class="bar-line"><span class="bar-lab">' + LEVELS[i].alt + '</span>'
        + '<span class="bar-track"><span class="bar-fill" style="width:' + (counts[i]/max*100)
        + '%;background:' + LEVELS[i].tint + '"></span></span>'
        + '<span class="bar-n">' + counts[i] + '</span></div>';
    }
    view.innerHTML = '<div class="figs">'
      + '<div><p class="fig-n">' + all.length + '</p><p class="fig-l">登録した単語</p></div>'
      + '<div><p class="fig-n">' + counts[TOP] + '</p><p class="fig-l">巡航に到達</p></div>'
      + '<div><p class="fig-n">' + acc + '%</p><p class="fig-l">正答率</p></div>'
      + '</div><div class="bars">' + bars + '</div>';
  }

  function renderPreview(){
    var L = LEVELS[previewLevel];
    var btns = LEVELS.map(function(x, i){
      return '<button class="lvlbtn' + (i === previewLevel ? ' on' : '') + '" data-lvl="' + i + '">' + x.alt + '</button>';
    }).join('');
    var interval = L.days === 0
      ? '覚えるまで、その日のうちにくり返し出題されます。'
      : '正解すると、次は約' + L.days + '日後に出題されます。';
    view.innerHTML = '<p class="progress">高度を選ぶと、その景色を先に見られます。</p>'
      + '<div class="frame">' + skyHTML(L)
      + '<div class="wx"><span>高度 <b>' + L.alt + '</b>　' + esc(L.name) + '</span>'
      + '<span>' + esc(L.wx) + '</span></div>'
      + '<div class="card"><div class="lvlrow">' + btns + '</div>'
      + '<p class="ex-ja" style="margin-top:14px">' + esc(interval) + '</p></div></div>';
  }

  function rebuild(){
    var d = dueList().length, n = active().length;
    $('dueN').textContent = d ? d : '';
    $('allN').textContent = n ? n : '';
    if (tab === 'review') renderReview();
    else if (tab === 'list') renderList();
    else if (tab === 'sky') renderPreview();
    else renderStats();
    $('outBox').value = JSON.stringify(active());
  }

  /* ---------- 操作 ---------- */

  view.addEventListener('click', function(e){
    var act = e.target.getAttribute && e.target.getAttribute('data-act');
    if (act){
      if (act === 'reveal'){ shown = true; renderReview(); return; }
      var w = queue[0]; if (!w) return;
      if (act === 'ok'){ promote(w); queue.shift(); }
      if (act === 'hold'){ hold(w); queue.shift(); }
      if (act === 'ng'){ demote(w); queue.shift(); queue.push(w); }
      shown = false; save(); rebuild(); return;
    }
    var lvl = e.target.getAttribute && e.target.getAttribute('data-lvl');
    if (lvl !== null && lvl !== undefined && lvl !== ''){
      previewLevel = parseInt(lvl, 10) || 0;
      renderPreview();
      return;
    }
    var del = e.target.getAttribute && e.target.getAttribute('data-del');
    if (del){
      words.forEach(function(w){ if (w.id === del){ w.deleted = true; touch(w); } });
      queue = queue.filter(function(w){ return w.id !== del; });
      save(); rebuild();
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      tab = b.getAttribute('data-tab');
      if (tab === 'review'){ queue = dueList(); shown = false; }
      rebuild();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-panel]'), function(b){
    b.addEventListener('click', function(){
      var p = $('panel-' + b.getAttribute('data-panel'));
      var wasOpen = p.classList.contains('open');
      Array.prototype.forEach.call(document.querySelectorAll('.panel'), function(x){ x.classList.remove('open'); });
      if (!wasOpen) p.classList.add('open');
    });
  });

  $('posRow').addEventListener('click', function(e){
    var v = e.target.getAttribute && e.target.getAttribute('data-pos');
    if (!v) return;
    manualPos = (manualPos === v) ? '' : v;
    Array.prototype.forEach.call($('posRow').children, function(b){
      b.className = 'posbtn' + (b.getAttribute('data-pos') === manualPos ? ' on' : '');
    });
  });

  $('addBtn').addEventListener('click', function(){
    if (!loaded) return;
    if (canLookup()) addAuto(); else addManual();
  });
  $('wordIn').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('addBtn').click(); }
  });

  $('cfgSave').addEventListener('click', function(){
    cfg = { url:$('cfgUrl').value.trim(), key:$('cfgKey').value.trim(),
            code:$('cfgCode').value.trim(), aikey:$('cfgAi').value.trim() };
    store.set(CFG, JSON.stringify(cfg)).then(function(){
      applyMode();
      say('設定を保存しました。'); syncNow(false);
    }).catch(function(){ say('設定を保存できませんでした。', true); });
  });
  $('syncNowBtn').addEventListener('click', function(){ syncNow(false); });

  $('copyBtn').addEventListener('click', function(){
    var box = $('outBox');
    box.select(); box.setSelectionRange(0, 999999);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    if (!ok && navigator.clipboard){
      navigator.clipboard.writeText(box.value).then(function(){ say('コピーしました。'); })
        .catch(function(){ say('選択したテキストを長押しでコピーしてください。', true); });
    } else {
      say(ok ? 'コピーしました。' : '選択したテキストを長押しでコピーしてください。', !ok);
    }
  });

  $('importBtn').addEventListener('click', function(){
    var raw = $('inBox').value.trim();
    if (!raw){ say('貼り付けてから読み込んでください。', true); return; }
    var incoming;
    try { incoming = JSON.parse(raw); }
    catch(e){ say('形式が違います。書き出したテキストをそのまま貼ってください。', true); return; }
    if (!Array.isArray(incoming)){ say('形式が違います。', true); return; }
    var added = 0;
    incoming.forEach(function(o){
      if (!o || !o.word || known(o.word)) return;
      var w = makeWord(o);
      if (typeof o.level === 'number') w.level = Math.min(Math.max(o.level, 0), TOP);
      if (typeof o.due === 'number') w.due = o.due;
      w.right = o.right || 0; w.wrong = o.wrong || 0;
      words.push(w); added++;
    });
    $('inBox').value = '';
    say(added + '語を読み込みました。');
    save().then(rebuild);
  });

  $('wipe').addEventListener('click', function(){
    if (!confirm('登録した単語をすべて消します。同期している端末からも消えます。よろしいですか。')) return;
    words.forEach(function(w){ if (!w.deleted){ w.deleted = true; touch(w); } });
    queue = [];
    save().then(function(){ say('すべて消しました。'); rebuild(); });
  });

  function applyMode(){
    if (canLookup()){
      $('modeText').textContent = '自動入力';
      $('capLabel').textContent = 'わからなかった単語';
      $('wordIn').placeholder = 'turbulence\n改行かカンマで区切れば、まとめて追加できます';
      $('addBtn').textContent = '調べて追加';
      $('manualFields').style.display = 'none';
      $('capHint').textContent = '意味・発音記号・例文は自動で調べます。';
    } else {
      $('modeText').textContent = '手入力';
      $('capLabel').textContent = '単語と意味を入力';
      $('wordIn').placeholder = 'turbulence';
      $('manualFields').style.display = 'grid';
      $('addBtn').textContent = '追加';
      $('capHint').textContent = '「同期の設定」にAIキーを入れると、自動で調べるようになります。';
    }
  }

  window.addEventListener('online', function(){ if (ready()) syncNow(true); });

  /* ---------- 起動 ---------- */

  applyMode();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  load();
})();
</script>
</body>
</html>
